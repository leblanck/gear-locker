*{box-sizing:border-box}
html,body{margin:0;overflow-x:clip}
body{
  background:var(--color-paper);color:var(--color-ink);
  font-family:var(--font-body);font-size:16px;line-height:1.5;
  -webkit-text-size-adjust:100%;
}
img{display:block;max-width:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--color-focus);outline-offset:2px}
::selection{background:var(--color-accent-soft);color:var(--color-ink)}
html{scrollbar-color:var(--color-muted) var(--color-paper);caret-color:var(--color-accent)}
.num{font-family:var(--font-outlier);font-variant-numeric:tabular-nums}
.wrap{max-width:1320px;margin:0 auto;padding:0 var(--pad)}
.hidden{display:none !important}
code{font-family:var(--font-outlier);font-size:.9em}

/* ---------- buttons: moulded keys ---------- */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  min-height:44px;padding:0 20px;
  border:1px solid var(--color-rule);border-radius:var(--radius-pill);
  background:var(--color-paper-2);color:var(--color-ink);
  font:500 15px/1 var(--font-body);
  box-shadow:inset 0 1px 0 var(--color-sheet),0 1px 1px var(--color-rule);
  transition:transform var(--dur-micro) var(--ease-out),background-color var(--dur-micro) var(--ease-out),border-color var(--dur-micro) var(--ease-out);
}
.btn:hover{background:var(--color-paper-3);border-color:var(--color-muted)}
.btn:active{transform:translateY(1px)}
.btn:disabled{cursor:progress;transform:none;background:var(--color-paper-3);color:var(--color-muted);border-color:var(--color-rule)}
.btn-key{
  background:var(--color-accent);color:var(--color-accent-ink);
  border-color:color-mix(in oklab,var(--color-accent) 78%,var(--color-ink));
  box-shadow:inset 0 1px 0 color-mix(in oklab,var(--color-sheet) 32%,transparent),inset 0 -1px 0 color-mix(in oklab,var(--color-ink) 10%,transparent);
}
.btn-key:hover{background:color-mix(in oklab,var(--color-accent) 88%,var(--color-ink));border-color:color-mix(in oklab,var(--color-accent) 70%,var(--color-ink))}
.btn-quiet{min-height:40px;padding:0 16px;font-size:14px}
.btn-danger{border:0;box-shadow:none;background:transparent;color:var(--color-danger);padding:0 4px;min-height:40px;text-decoration:underline;text-underline-offset:3px}
.btn-danger:hover{background:var(--color-danger-soft);border-color:transparent}

.seg{display:flex;border:1px solid var(--color-rule);border-radius:var(--radius-pill);overflow:hidden;background:var(--color-paper-2)}
.seg button{min-height:44px;padding:0 16px;border:0;background:transparent;font:500 14px var(--font-body);color:var(--color-muted);transition:background-color var(--dur-micro) var(--ease-out)}
.seg button+button{border-left:1px solid var(--color-rule)}
.seg button:hover{color:var(--color-ink);background:var(--color-paper-3)}
.seg button[aria-pressed="true"]{background:var(--color-ink);color:var(--color-paper)}

/* ---------- the survey: header + totals on a contour field ---------- */
.topo{position:relative;isolation:isolate;border-bottom:2px solid var(--color-ink)}
.topo::before{
  content:"";position:absolute;inset:0;z-index:-1;pointer-events:none;
  background:var(--color-contour);opacity:.6;
  -webkit-mask-image:var(--topo),linear-gradient(to bottom,var(--mask-solid) 55%,transparent);
  -webkit-mask-size:cover,100% 100%;-webkit-mask-position:right top,0 0;-webkit-mask-repeat:no-repeat;-webkit-mask-composite:source-in;
  mask-image:var(--topo),linear-gradient(to bottom,var(--mask-solid) 55%,transparent);
  mask-size:cover,100% 100%;mask-position:right top,0 0;mask-repeat:no-repeat;mask-composite:intersect;
}
.mast{border-bottom:1px solid color-mix(in oklab,var(--color-ink) 70%,transparent)}
.mast-in{display:flex;flex-wrap:wrap;align-items:center;gap:12px 20px;padding-top:16px;padding-bottom:16px}
.mark{margin:0;font-family:var(--font-display);font-weight:600;font-size:24px;letter-spacing:-0.03em;line-height:1}
.search{flex:1 1 260px;min-width:0;position:relative}
.search label{position:absolute;left:16px;top:4px;font-size:12px;font-weight:500;color:var(--color-muted);pointer-events:none}
.search input{
  width:100%;height:48px;padding:20px 16px 4px;
  border:1px solid var(--color-muted);border-radius:var(--radius-pill);
  background:var(--color-paper-2);font-size:15px;color:var(--color-ink);
}
.search input::placeholder{color:var(--color-muted)}
.search input:focus{border-color:var(--color-ink);outline:2px solid var(--color-focus);outline-offset:1px}

.tally{display:flex;flex-wrap:wrap;gap:8px 36px;align-items:baseline;padding-top:20px}
.tally > span{display:flex;align-items:baseline;gap:8px;color:var(--color-muted);font-size:15px}
.tally b{font-family:var(--font-display);font-weight:600;font-size:40px;letter-spacing:-0.035em;line-height:1;color:var(--color-ink);font-variant-numeric:tabular-nums}
.bar{
  display:flex;gap:2px;height:16px;margin-top:16px;padding:2px;
  border:1px solid var(--color-ink);border-radius:var(--radius-pill);background:var(--color-paper-2);
}
.bar i{display:block;height:100%;border-radius:2px;transition:flex-grow var(--dur-short) var(--ease-out)}
.chips{display:flex;flex-wrap:wrap;gap:8px;padding:12px 0 20px}
.chip{
  display:inline-flex;align-items:center;gap:8px;min-height:36px;padding:0 12px;
  border:1px solid var(--color-rule);border-radius:var(--radius-pill);background:var(--color-paper-2);
  font:500 14px var(--font-body);color:var(--color-ink);
  transition:border-color var(--dur-micro) var(--ease-out),background-color var(--dur-micro) var(--ease-out);
}
.chip .n{font-family:var(--font-outlier);font-size:13px;color:var(--color-muted)}
.chip:hover{border-color:var(--color-ink)}
.chip[aria-pressed="true"]{background:var(--color-ink);border-color:var(--color-ink);color:var(--color-paper)}
.chip[aria-pressed="true"] .n{color:var(--color-paper)}
.swatch{display:inline-block;width:10px;height:10px;border-radius:2px;flex:none;text-decoration:none}

/* ---------- toolbar under the survey ---------- */
.controls{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;padding-top:20px;padding-bottom:16px}
.controls h2{margin:0;font-family:var(--font-display);font-weight:600;font-size:24px;letter-spacing:-0.03em;line-height:1.1}
.controls .right{display:flex;flex-wrap:wrap;gap:8px}
select{
  height:44px;padding:0 12px;border:1px solid var(--color-muted);border-radius:var(--radius-pill);
  background:var(--color-paper-2);font:500 14px var(--font-body);color:var(--color-ink);
}

/* ---------- work area: the list, and the open entry beside it ---------- */
main{padding-bottom:64px}
.work{display:grid;grid-template-columns:minmax(0,1fr);gap:28px;align-items:start}
.work.has-entry{grid-template-columns:minmax(0,1fr) minmax(0,400px)}

/* table view */
.ledger{width:100%;border-collapse:collapse;font-size:15px}
.ledger thead th{text-align:left;font-weight:500;font-size:13px;color:var(--color-muted);padding:0 12px 8px;border-bottom:1px solid var(--color-ink)}
.ledger .r{text-align:right}
.ledger tbody td{padding:8px 12px;border-bottom:1px solid var(--color-rule);vertical-align:middle}
.ledger tbody tr{cursor:pointer;transition:background-color var(--dur-micro) var(--ease-out)}
.ledger tbody tr:hover{background:var(--color-paper-3)}
.ledger tbody tr[aria-selected="true"]{background:var(--color-accent-soft)}
.ledger tfoot td{padding:12px;border-top:2px solid var(--color-ink);font-weight:500}
.ledger .c-photo{width:68px}
.th{width:44px;height:44px;border-radius:6px;background:var(--color-photo);object-fit:contain;border:1px solid var(--color-rule)}
.th.empty{display:grid;place-items:center;background:var(--color-paper-3);color:var(--color-muted);font-size:11px}
.nm{
  display:block;padding:0;border:0;background:none;text-align:left;
  font-weight:500;line-height:1.25;color:var(--color-ink);overflow-wrap:anywhere;
}
.nm:hover{text-decoration:underline;text-underline-offset:3px}
.br{display:flex;align-items:center;gap:8px;margin-top:4px;color:var(--color-muted);font-size:13px;min-width:0}
.br span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bicon{width:16px;height:16px;flex:0 0 16px;object-fit:contain;background:var(--color-photo);border-radius:3px}
.cat{display:inline-flex;align-items:center;gap:8px;font-size:14px}
.wt{font-family:var(--font-outlier);font-size:14px;white-space:nowrap;word-spacing:-0.3em}
.wt.none{color:var(--color-muted);font-family:var(--font-body);font-size:13px;word-spacing:normal}

/* grid view: gear tags */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,190px),1fr));gap:16px}
.item{
  display:flex;flex-direction:column;min-width:0;padding:0;text-align:left;
  border:1px solid var(--color-rule);border-radius:var(--radius-card);background:var(--color-paper-2);overflow:hidden;
  transition:transform var(--dur-short) var(--ease-out),box-shadow var(--dur-short) var(--ease-out);
}
.item:hover{transform:translateY(-2px);box-shadow:var(--shadow-lift)}
.item[aria-pressed="true"]{border-color:var(--color-ink);box-shadow:0 0 0 1px var(--color-ink)}
.shot{aspect-ratio:4/3;background:var(--color-photo);border-bottom:1px solid var(--color-rule);display:grid;place-items:center}
.shot img{width:100%;height:100%;object-fit:contain;min-height:0}
.shot.empty{background:var(--color-paper-3);color:var(--color-muted);font-size:13px}
.tag{display:flex;flex-direction:column;gap:4px;padding:12px;flex:1;min-width:0}
.tag .br{margin:0}
.tag .name{font-weight:500;font-size:15px;line-height:1.25;overflow-wrap:anywhere}
.tag .desc{font-size:13px;color:var(--color-muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tag .foot{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:auto;padding-top:8px;border-top:1px dashed var(--color-rule)}
.tag .foot .cat{font-size:13px;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tag .foot .wt{font-size:13px}

/* the open entry: a waterproof notebook page */
.entry{
  border-radius:var(--radius-entry);background:var(--color-paper-2);
  box-shadow:0 0 0 1px var(--color-ink),var(--shadow-lift);overflow:hidden;
  position:sticky;top:16px;
}
.entry-head{background:var(--color-ink);color:var(--color-paper);padding:16px}
.entry-head .k{display:flex;justify-content:space-between;gap:12px;font-size:13px;color:color-mix(in oklab,var(--color-paper) 72%,var(--color-ink))}
.entry-head .k b{font-weight:500;color:var(--color-paper);display:inline-flex;gap:8px;align-items:center}
.entry-head .k span{display:inline-flex;gap:8px;align-items:center;min-width:0}
.entry-head h2{margin:12px 0 0;font-family:var(--font-display);font-weight:600;font-size:28px;letter-spacing:-0.035em;line-height:1.05;overflow-wrap:break-word;min-width:0;text-wrap:balance}
.entry-photo{background:var(--color-photo);border-bottom:1px solid var(--color-ink);aspect-ratio:4/3;display:grid;place-items:center}
.entry-photo img{width:100%;height:100%;object-fit:contain}
.notebook{
  background:
    linear-gradient(var(--color-grid) 1px,transparent 1px) 0 0/8px 8px,
    linear-gradient(90deg,var(--color-grid) 1px,transparent 1px) 0 0/8px 8px,
    var(--color-paper-2);
}
.cells{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
.cell{padding:12px 16px;border-bottom:1px solid var(--color-ink);min-width:0}
.cell:nth-child(odd){border-right:1px solid var(--color-ink)}
.cell.wide{grid-column:1/-1;border-right:0}
.cell small{display:block;font-size:12px;color:var(--color-muted)}
.cell strong{display:flex;align-items:center;gap:8px;font-weight:500;font-size:17px;overflow-wrap:anywhere}
.cell .num{font-size:17px;word-spacing:-0.3em}
.cell p{margin:0;white-space:pre-wrap;overflow-wrap:anywhere}
.keys{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;padding:12px}

/* ---------- empty states ---------- */
.blank{
  border:1px dashed var(--color-muted);border-radius:var(--radius-entry);background:var(--color-paper-2);
  padding:clamp(32px,7vw,64px) clamp(16px,4vw,40px);text-align:center;
}
.blank h2{margin:0 0 8px;font-family:var(--font-display);font-weight:600;font-size:clamp(24px,4vw,32px);letter-spacing:-0.035em;line-height:1.05}
.blank p{color:var(--color-muted);margin:0 auto 20px;max-width:46ch}
.blank .row2{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}

/* ---------- drawer: the add / edit form as a notebook page ---------- */
.scrim{position:fixed;inset:0;background:var(--color-scrim);display:none;z-index:40}
.scrim.on{display:block}
.drawer{
  position:fixed;z-index:50;top:0;right:0;bottom:0;width:min(468px,100%);
  background:var(--color-paper-2);border-left:1px solid var(--color-ink);box-shadow:var(--shadow-lift);
  display:flex;flex-direction:column;transform:translateX(101%);
  transition:transform var(--dur-short) var(--ease-out);
}
.drawer.on{transform:none}
.drawer header{display:flex;align-items:center;gap:12px;padding:16px var(--pad);background:var(--color-ink);color:var(--color-paper)}
.drawer header h2{margin:0;font-family:var(--font-display);font-weight:600;font-size:24px;letter-spacing:-0.03em}
.drawer header .x{
  margin-left:auto;width:40px;height:40px;border-radius:var(--radius-pill);
  border:1px solid color-mix(in oklab,var(--color-paper) 40%,transparent);background:transparent;color:var(--color-paper);
  font-size:16px;line-height:1;transition:background-color var(--dur-micro) var(--ease-out);
}
.drawer header .x:hover{background:color-mix(in oklab,var(--color-paper) 14%,transparent)}
.drawer header .x:focus-visible{outline-color:var(--color-accent)}
.dbody{overflow:auto;padding:20px var(--pad) 24px;flex:1}
.dfoot{display:flex;gap:8px;padding:12px var(--pad);border-top:1px solid var(--color-ink);background:var(--color-paper-2)}
.dfoot .btn-key{flex:1}
.field{margin-bottom:16px}
.field > label{display:block;font-size:13px;font-weight:500;color:var(--color-muted);margin-bottom:4px}
.field .opt{font-weight:400}
.field input[type=text],.field input[type=number],.field textarea,.field select{
  width:100%;min-height:48px;padding:8px 12px;
  border:1px solid var(--color-muted);border-radius:var(--radius-pill);
  background:var(--color-photo);font:400 16px var(--font-body);color:var(--color-ink);
}
.field input[type=number]{font-family:var(--font-outlier)}
.field textarea{resize:vertical;min-height:96px;line-height:1.45}
.field input:focus,.field textarea:focus,.field select:focus{border-color:var(--color-ink);outline:2px solid var(--color-focus);outline-offset:1px}
.pair{display:flex;gap:8px}
.pair .field{flex:1;min-width:0}
.pair .field.narrow{flex:0 0 104px}
.domain-row{display:flex;gap:8px;align-items:center}
.domain-row input{flex:1;min-width:0}
.domain-row .bicon{width:48px;height:48px;flex-basis:48px;padding:8px;border:1px solid var(--color-muted);border-radius:var(--radius-pill)}
.domain-row .btn{min-height:48px}
.hint-line{font-size:13px;color:var(--color-muted);margin:4px 0 0;min-height:20px}
.hint-line.warn{color:var(--color-danger)}
.drop{
  position:relative;display:grid;place-items:center;overflow:hidden;aspect-ratio:4/3;padding:16px;text-align:center;
  border:1px dashed var(--color-muted);border-radius:var(--radius-card);background:var(--color-photo);
}
.drop.has{border-style:solid;padding:0}
.drop img{width:100%;height:100%;object-fit:contain}
.drop .hint{color:var(--color-muted);font-size:14px}
.drop .hint b{display:block;font-family:var(--font-display);font-weight:600;font-size:18px;letter-spacing:-0.02em;color:var(--color-ink);margin-bottom:4px}
.drop input[type=file]{position:absolute;inset:0;opacity:0;cursor:pointer}
.drop:focus-within{outline:2px solid var(--color-focus);outline-offset:2px}
.shot-tools{display:flex;gap:8px;margin-top:8px}
.err{color:var(--color-danger);font-size:14px;margin:-8px 0 16px;display:none}
.err.on{display:block}

/* ---------- notices, tools, toast ---------- */
.notice{
  display:none;margin:0 0 20px;padding:12px 16px;font-size:14px;
  border:1px solid var(--color-ink);border-radius:var(--radius-card);background:var(--color-accent-soft);
}
.notice.on{display:block}
.notice b{font-weight:500}
.tools{
  display:flex;flex-wrap:wrap;gap:8px;align-items:center;
  margin-top:40px;padding-top:16px;border-top:1px solid var(--color-ink);
}
.tools .lbl{font-size:13px;font-weight:500;color:var(--color-muted);margin-right:4px}
.tools .spacer{flex:1}
.tools .store{font-size:13px;color:var(--color-muted)}
.toast{
  position:fixed;left:50%;bottom:24px;z-index:60;
  transform:translate(-50%,96px);opacity:0;
  padding:12px 16px;border-radius:var(--radius-pill);
  background:var(--color-ink);color:var(--color-paper);font-size:14px;font-weight:500;
  box-shadow:var(--shadow-lift);
  transition:transform var(--dur-short) var(--ease-out),opacity var(--dur-short) var(--ease-out);
}
.toast.on{transform:translate(-50%,0);opacity:1}

@media (max-width:960px){
  .work.has-entry{grid-template-columns:minmax(0,1fr)}
  .work.has-entry .entry{position:static;order:-1}
}
@media (max-width:640px){
  .hide-sm{display:none}
  .tally b{font-size:32px}

}

  *,*::before,*::after{animation:none !important;transition:none !important}
}

<body>

<div class="topo">
  <header class="mast">
    <div class="wrap mast-in">
      <h1 class="mark">Gear Locker</h1>
      <div class="search">
        <label for="q">Search</label>
        <input id="q" type="search" placeholder="Name, brand or description">
      </div>
      <div class="seg" role="group" aria-label="View">
        <button id="vList" aria-pressed="true">Table</button>
        <button id="vGrid" aria-pressed="false">Grid</button>
      </div>

        <button id="uImperial" aria-pressed="false">lb / oz</button>
      </div>
      <button class="btn btn-key" id="addBtn">Add item</button>
    </div>
  </header>

  <section class="wrap" aria-label="Totals">
    <div class="tally">
      <span><b id="tItems">0</b> items</span>
      <span><b id="tCats">0</b> categories</span>
      <span><b id="tWeight">0</b> <span id="tWeightUnit">kg in the locker</span></span>
    </div>
    <div class="bar" id="bar" role="img" aria-label="Share of items by category"></div>
    <div class="chips" id="chips" role="group" aria-label="Filter by category"></div>
  </section>
</div>

<main class="wrap">
  <div class="controls">
    <h2 id="stageTitle">All gear</h2>

      <select id="sort" aria-label="Sort by">
        <option value="added">Newest first</option>
        <option value="name">Item name A to Z</option>
        <option value="brand">Brand A to Z</option>
        <option value="cat">Category</option>
        <option value="heavy">Heaviest first</option>
        <option value="light">Lightest first</option>
      </select>
    </div>
  </div>

  <div class="notice" id="notice"></div>
  <div class="work" id="work">
    <div id="stage"></div>
    <article class="entry hidden" id="entry" aria-label="Selected item"></article>
  </div>

  <div class="tools">
    <span class="lbl">Your data</span>
    <button class="btn btn-quiet" id="expJson">Download backup</button>
    <button class="btn btn-quiet" id="impBtn">Restore backup</button>
    <button class="btn btn-quiet" id="expCsv">Export spreadsheet</button>
    <button class="btn btn-quiet" id="brandBtn">Fetch brand logos</button>
    <input type="file" id="impFile" accept="application/json,.json" class="hidden">
    <span class="spacer"></span>
    <span class="store" id="storeNote"></span>
  </div>
</main>

<div class="scrim" id="scrim"></div>

<aside class="drawer" id="drawer" role="dialog" aria-modal="true" aria-labelledby="dTitle">
  <header>
    <h2 id="dTitle">Add item</h2>
    <button class="x" id="dClose" aria-label="Close">✕</button>
  </header>
  <div class="dbody notebook">
    <div class="field">
      <label for="fPhoto">Photo</label>
      <div class="drop" id="drop">
        <img id="preview" alt="" class="hidden">

      </div>

        <button class="btn btn-quiet" id="dropClear">Remove photo</button>
      </div>
    </div>

    <div class="field">
      <label for="fCat">Category</label>
      <select id="fCat"></select>
    </div>
    <div class="field hidden" id="newCatField">
      <label for="fNewCat">New category name</label>
      <input type="text" id="fNewCat" placeholder="e.g. Packrafting" maxlength="28">
    </div>

    <div class="field">
      <label for="fBrand">Brand</label>
      <input type="text" id="fBrand" placeholder="e.g. Osprey" maxlength="60">
    </div>

    <div class="field">
      <label for="fDomain">Brand website <span class="opt">(for the logo)</span></label>
      <div class="domain-row">
        <img id="bPreview" class="bicon hidden" alt="">
        <input type="text" id="fDomain" placeholder="osprey.com" maxlength="80">

  </div>
</aside>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
"use strict";

/* ============================================================
   1. Categories
   ============================================================ */
const BASE_CATS = [
  ["PCK","Backpacks"],
  ["SHL","Shelter & Tents"],
  ["SLP","Sleep System"],
  ["CKG","Cooking"],
  ["HYD","Hydration"],
  ["CLO","Clothing"],
  ["FTW","Footwear"],
  ["NAV","Navigation"],
  ["LGT","Lighting"],
  ["SAF","Safety & First Aid"],
  ["TLS","Tools & Repair"],
  ["ELC","Electronics"],
  ["CLB","Climbing"],
  ["WTR","Water Sports"],
  ["SNW","Winter & Snow"],
  ["MSC","Other"]
];
const SWATCH = ["#2E5A4B","#E9B10C","#5A6E7A","#A63A28","#3D6E8C","#7A6A3F",
                "#8C4A6B","#4A7A2E","#6B5B95","#B3762A","#2F7D7D","#8A8A5C",
                "#93493F","#3B5E9B","#6E7B4E","#7C7C86"];

let customCats = [];
const allCats = () => BASE_CATS.concat(customCats);
const catName = c => (allCats().find(x => x[0] === c) || [c, c])[1];
const catColor = c => {
  const i = allCats().findIndex(x => x[0] === c);
  return SWATCH[(i < 0 ? 0 : i) % SWATCH.length];
};
function makeCode(name){
  const base = (name.replace(/[^a-z]/gi,"").toUpperCase() + "XXX").slice(0,3);
  const taken = new Set(allCats().map(c => c[0]));
  if (!taken.has(base)) return base;
  for (let i = 2; i < 99; i++){ const t = base.slice(0,2) + i; if (!taken.has(t)) return t; }
  return "C" + Date.now().toString(36).slice(-2).toUpperCase();
}

/* ============================================================
   2. Weight helpers — everything is stored in grams
   ============================================================ */
const TO_G = { g:1, kg:1000, oz:28.349523125, lb:453.59237 };
let metric = true;

function fmtWeight(g){
  if (!g) return "—";
  if (metric) return g < 1000 ? Math.round(g) + " g" : (g/1000).toFixed(g < 10000 ? 2 : 1) + " kg";
  const oz = g / TO_G.oz;
  if (oz < 16) return (Math.round(oz*10)/10) + " oz";
  const lb = g / TO_G.lb;
  return lb.toFixed(lb < 10 ? 2 : 1) + " lb";
}
const fmtTotal = g => !g ? "—" : (metric ? (g/1000).toFixed(2) : (g/TO_G.lb).toFixed(2));

/* ============================================================
   3. Talking to the server
   ============================================================ */
let online = false;

async function api(path, body){
  const res = await fetch("/api/" + path, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(body)
  });
  let data = null;
  try { data = await res.json(); } catch (e){ /* fall through */ }
  if (!res.ok) throw new Error((data && data.error) || ("server said " + res.status));
  return data;
}
function adopt(state){
  if (!state) return;
  if (Array.isArray(state.items)) items = state.items;
  if (Array.isArray(state.customCats)) customCats = state.customCats;
  if (typeof state.metric === "boolean") metric = state.metric;
}
/* Any write failure means the terminal window probably closed. */
function writeFailed(e){
  console.error(e);
  toast("Not saved — is the server still running?");
  offline(String(e && e.message || e));
}

const photoUrl = it => "/photos/" + encodeURIComponent(it.id) + ".jpg?v=" + (it.updated || 0);

/* Mirrors domain_slug() in gear.py: osprey.com -> osprey-com */
const slugOf = d => String(d || "").toLowerCase().replace(/[^a-z0-9.-]/g,"").slice(0,60).replace(/\./g,"-");
/* If the icon was never fetched the request 404s and we drop the element. */

}

/* ============================================================
   5. Filtering + sorting
   ============================================================ */
function visible(){
  const q = query.trim().toLowerCase();
  const out = items.filter(it => {
    if (filterCat !== "ALL" && it.cat !== filterCat) return false;
    if (!q) return true;
    return (it.name + " " + it.brand + " " + it.desc + " " + catName(it.cat))
      .toLowerCase().includes(q);
  });
  const byName = (a,b) => a.name.localeCompare(b.name, undefined, { sensitivity:"base" });
  const cmp = {
    added: (a,b) => b.added - a.added,
    name:  byName,
    brand: (a,b) => (a.brand||"~").localeCompare(b.brand||"~", undefined, { sensitivity:"base" }) || byName(a,b),
    cat:   (a,b) => catName(a.cat).localeCompare(catName(b.cat)) || byName(a,b),
    heavy: (a,b) => (b.g||0) - (a.g||0) || byName(a,b),
    light: (a,b) => (a.g||Infinity) - (b.g||Infinity) || byName(a,b)
  }[sortBy];
  return out.sort(cmp);
}

/* ============================================================
   6. Render
   ============================================================ */
function render(){
  const shown = visible();

  /* --- ledger rail: reflects what you're currently looking at --- */
  const totalG = shown.reduce((s,i) => s + (i.g||0), 0);
  const counts = {};
  shown.forEach(i => counts[i.cat] = (counts[i.cat]||0) + 1);
  const keys = Object.keys(counts).sort((a,b) => counts[b] - counts[a]);

  $("tItems").textContent  = shown.length;
  $("tCats").textContent   = keys.length;
  $("tWeight").textContent = totalG ? fmtTotal(totalG) : "0";
  $("tWeightUnit").textContent = (metric ? "kg" : "lb") + " in the locker";
  $("uMetric").setAttribute("aria-pressed", metric);
  $("uImperial").setAttribute("aria-pressed", !metric);

  $("bar").innerHTML = shown.length
    ? keys.map(c => `<i style="flex:${counts[c]};background:${catColor(c)}" title="${esc(catName(c))} ${counts[c]}"></i>`).join("")
    : "";
  $("bar").setAttribute("aria-label", "Share of items by category: "
    + keys.map(c => catName(c) + " " + counts[c]).join(", "));

  /* --- category chips: only categories you own, in the bar's order, so they are its key --- */
  const own = {};
  items.forEach(i => own[i.cat] = (own[i.cat]||0) + 1);
  const ownKeys = Object.keys(own).sort((a,b) => own[b] - own[a] || catName(a).localeCompare(catName(b)));
  $("chips").innerHTML = items.length
    ? [`<button class="chip" data-cat="ALL" aria-pressed="${filterCat==="ALL"}">All gear <span class="n">${items.length}</span></button>`]
      .concat(ownKeys.map(c => `<button class="chip" data-cat="${esc(c)}" aria-pressed="${filterCat===c}">`
          + `<s class="swatch" style="background:${catColor(c)}"></s>${esc(catName(c))} <span class="n">${own[c]}</span></button>`))
      .join("")
    : "";
  $("stageTitle").textContent = filterCat === "ALL" ? "All gear" : catName(filterCat);

  /* --- stage --- */
  const stage = $("stage");
  if (selectedId && !shown.some(i => i.id === selectedId)) selectedId = null;
  renderEntry();
  if (!items.length){
    stage.innerHTML = `<div class="blank">
      <h2>The locker is empty</h2>
      <p>Add your first piece of kit (a pack, a stove, that tent in the garage) and it will show up here, sortable and searchable.</p>
      <div class="row2">
        <button class="btn btn-key" data-act="add">Add your first item</button>
        <button class="btn" data-act="sample">Load 8 example items</button>
      </div></div>`;
    return;
  }
  if (!shown.length){
    stage.innerHTML = `<div class="blank">
      <h2>Nothing matches</h2>
      <p>No gear fits that search and filter. Clear them to see the whole locker again.</p>
      <div class="row2"><button class="btn" data-act="clear">Clear search and filter</button></div></div>`;
    return;
  }

  const brandLine = it => it.brand
    ? `<span class="br">${brandIcon(it)}<span>${esc(it.brand)}</span></span>` : "";
  const catLine = it => `<span class="cat"><s class="swatch" style="background:${catColor(it.cat)}"></s>${esc(catName(it.cat))}</span>`;
  const wtCell = it => it.g ? esc(fmtWeight(it.g)) : "not set";

  if (view === "grid"){
    stage.innerHTML = `<div class="grid">` + shown.map(it => `
      <button class="item" data-id="${esc(it.id)}" aria-pressed="${it.id === selectedId}">
        ${it.photo
          ? `<span class="shot"><img src="${photoUrl(it)}" alt="" loading="lazy"></span>`
          : `<span class="shot empty">No photo yet</span>`}
        <span class="tag">
          ${brandLine(it)}
          <span class="name">${esc(it.name)}</span>
          ${it.desc ? `<span class="desc">${esc(it.desc)}</span>` : ``}
          <span class="foot">${catLine(it)}<span class="wt${it.g ? "" : " none"}">${wtCell(it)}</span></span>
        </span>
      </button>`).join("") + `</div>`;
  } else {
    stage.innerHTML = `<table class="ledger">
      <thead><tr><th class="c-photo"><span class="hide-sm">Photo</span></th><th>Item</th><th class="hide-sm">Category</th><th class="r">Weight</th></tr></thead>
      <tbody>` + shown.map(it => `
        <tr data-id="${esc(it.id)}" aria-selected="${it.id === selectedId}">
          <td>${it.photo
            ? `<img class="th" src="${photoUrl(it)}" alt="" loading="lazy">`
            : `<span class="th empty">none</span>`}</td>
          <td><button class="nm" data-id="${esc(it.id)}">${esc(it.name)}</button>${brandLine(it)}</td>
          <td class="hide-sm">${catLine(it)}</td>
          <td class="r wt${it.g ? "" : " none"}">${wtCell(it)}</td>
        </tr>`).join("") + `</tbody>
      <tfoot><tr><td></td><td>${shown.length} item${shown.length === 1 ? "" : "s"}</td><td class="hide-sm"></td>
        <td class="r wt">${totalG ? esc(fmtWeight(totalG)) : ""}</td></tr></tfoot>
    </table>`;
  }
}

/* ============================================================
   7. Photos — shrunk in the browser before they're sent
   ============================================================ */
function compress(file, max = 1000, q = 0.82){
  return new Promise((resolve, reject) => {
    if (!file || !/^image\//.test(file.type)) return reject(new Error("not an image"));
    const url = URL.createObjectURL(file), img = new Image();
    img.onload = () => {
      const scale = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement("canvas");
      c.width  = Math.max(1, Math.round(img.width  * scale));
      c.height = Math.max(1, Math.round(img.height * scale));
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      resolve(c.toDataURL("image/jpeg", q));
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error("unreadable image")); };
    img.src = url;
  });
}
function showPhoto(src, mode){
  photoState = { mode: mode, data: mode === "new" ? src : null };
  const p = $("preview"), d = $("drop");
  if (src){
    p.src = src; p.classList.remove("hidden");
    $("dropHint").classList.add("hidden"); d.classList.add("has");
    $("shotTools").classList.remove("hidden");
  } else {
    p.removeAttribute("src"); p.classList.add("hidden");
    $("dropHint").classList.remove("hidden"); d.classList.remove("has");
    $("shotTools").classList.add("hidden");
    $("fPhoto").value = "";
  }
}

   8. Drawer
   ============================================================ */
function buildCatSelect(selected){
  $("fCat").innerHTML = allCats()
    .map(([c,n]) => `<option value="${esc(c)}"${c===selected?" selected":""}>${esc(n)}</option>`)
    .join("") + `<option value="__new">New category…</option>`;
  $("newCatField").classList.add("hidden");
}
function openDrawer(item){
  editing = item || null;
  $("dTitle").textContent = item ? "Edit item" : "Add item";
  $("saveBtn").textContent = item ? "Save changes" : "Save item";
  $("delBtn").classList.toggle("hidden", !item);
  $("errName").classList.remove("on");

  buildCatSelect(item ? item.cat : (filterCat !== "ALL" ? filterCat : "PCK"));
  $("fBrand").value = item ? item.brand : "";
  setDomain(item ? item.domain : "", "");
  $("fName").value  = item ? item.name  : "";
  $("fDesc").value  = item ? item.desc  : "";
  $("fNewCat").value = "";
  if (item && item.g){
    if (metric){
      $("fUnit").value = item.g < 1000 ? "g" : "kg";
      $("fWeight").value = item.g < 1000 ? Math.round(item.g) : +(item.g/1000).toFixed(3);
    } else {
      $("fUnit").value = "oz";
      $("fWeight").value = +(item.g/TO_G.oz).toFixed(2);
    }
  } else {
    $("fWeight").value = ""; $("fUnit").value = metric ? "g" : "oz";
  }
  showPhoto(item && item.photo ? photoUrl(item) : null, item && item.photo ? "keep" : "none");

  $("scrim").classList.add("on");
  $("drawer").classList.add("on");
  setTimeout(() => $("fName").focus(), 260);
}
function closeDrawer(){
  $("scrim").classList.remove("on");
  $("drawer").classList.remove("on");
  editing = null; photoState = { mode:"none", data:null };
  $("addBtn").focus();
}

async function save(){
  const name = $("fName").value.trim();
  if (!name){ $("errName").classList.add("on"); $("fName").focus(); return; }

  let cat = $("fCat").value;
  let newCat = null;
  if (cat === "__new"){
    const nm = $("fNewCat").value.trim();
    if (!nm){ $("fNewCat").focus(); return; }
    newCat = [makeCode(nm), nm];
    cat = newCat[0];
  }
  const raw = parseFloat($("fWeight").value);
  const item = {
    id: editing ? editing.id : "",
    added: editing ? editing.added : Date.now(),
    cat, name,
    brand: $("fBrand").value.trim(),
    domain: $("fDomain").value.trim(),
    desc:  $("fDesc").value.trim(),
    g: isFinite(raw) && raw > 0 ? raw * TO_G[$("fUnit").value] : 0,
    photo: photoState.mode === "new" ? true
         : photoState.mode === "keep" ? !!(editing && editing.photo) : false
  };

  const btn = $("saveBtn");
  btn.disabled = true;
  btn.textContent = "Saving…";
  try {
    if (newCat){
      customCats = customCats.concat([newCat]);
      adopt(await api("meta", { customCats }));
    }
    const payload = { item };
    if (photoState.mode === "new") payload.photoData = photoState.data;
    adopt(await api("save", payload));
    const wasEditing = !!editing;
    closeDrawer(); render();
    toast(wasEditing ? "Saved" : "Added to locker");
  } catch (e){
    writeFailed(e);
  } finally {
    btn.disabled = false;
    btn.textContent = editing ? "Save changes" : "Save item";
  }
}
async function remove(){
  if (!editing) return;
  if (!confirm(`Delete "${editing.name}" from the locker? This can't be undone.`)) return;
  try {
    adopt(await api("delete", { id: editing.id }));
    closeDrawer(); render(); toast("Deleted");
  } catch (e){ writeFailed(e); }
}

/* ============================================================
   9. Backup, restore, spreadsheet
   ============================================================ */
function exportCsv(){
  const cell = v => `"${String(v == null ? "" : v).replace(/"/g,'""')}"`;
  const rows = [["Category","Code","Brand","Item name","Description","Weight (g)","Weight (oz)","Has photo","Added"]];
  visible().forEach(i => rows.push([
    catName(i.cat), i.cat, i.brand, i.name, i.desc,
    i.g ? Math.round(i.g) : "", i.g ? (i.g/TO_G.oz).toFixed(2) : "",
    i.photo ? "yes" : "no", new Date(i.added).toISOString().slice(0,10)
  ]));
  const blob = new Blob([rows.map(r => r.map(cell).join(",")).join("\r\n")], { type:"text/csv" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "gear-locker-" + new Date().toISOString().slice(0,10) + ".csv";
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
  toast("Spreadsheet downloaded");
}
async function importJson(file){
  try {
    const data = JSON.parse(await file.text());
    const payload = Array.isArray(data) ? { items:data } : data;
    const state = await api("import", { items: payload.items, customCats: payload.customCats });
    adopt(state); render();
    const n = state.imported || 0;
    toast(n + " item" + (n === 1 ? "" : "s") + " restored");
  } catch (e){
    console.error(e);
    alert("That file couldn't be restored. Pick the .json file you saved with “Download backup”.");
  }
}

   10b. Brand logos
   ============================================================ */
function showBrandIcon(domain){
  const img = $("bPreview");
  if (!domain){ img.classList.add("hidden"); img.removeAttribute("src"); return; }
  img.onload  = () => img.classList.remove("hidden");
  img.onerror = () => img.classList.add("hidden");
  img.src = "/brands/" + slugOf(domain) + "?t=" + Date.now();
}
function setDomain(domain, status){
  $("fDomain").value = domain || "";
  const line = $("bStatus");
  line.textContent = status || "";
  line.classList.remove("warn");
  showBrandIcon(domain);
}
function say(msg, bad){
  const line = $("bStatus");
  line.textContent = msg;
  line.classList.toggle("warn", !!bad);
}
async function lookupBrand(){
  const brand  = $("fBrand").value.trim();
  const domain = $("fDomain").value.trim();
  if (!brand && !domain){ say("Enter a brand first", true); return; }

  const btn = $("bFetch");
  btn.disabled = true; say("Looking\u2026");
  try {
    const r = await api("brand", { brand, domain });
    $("fDomain").value = r.domain || "";
    if (r.icon){
      say(r.cached ? "Logo already saved" : "Logo saved");
      showBrandIcon(r.domain);
    } else {
      say(r.reason || "No logo found \u2014 try editing the address", true);
      showBrandIcon("");
    }
  } catch (e){
    say("Couldn't reach the server", true);
  } finally {
    btn.disabled = false;
  }
}
async function fetchAllBrands(){
  const seen = new Map();
  items.forEach(i => {
    const key = (i.domain || i.brand || "").toLowerCase();
    if (key && !seen.has(key)) seen.set(key, i);
  });
  const list = Array.from(seen.values());
  if (!list.length){ toast("No brands to look up yet"); return; }

  const btn = $("brandBtn");
  const label = btn.textContent;
  btn.disabled = true;
  let found = 0, done = 0;
  for (const it of list){
    btn.textContent = "Fetching " + (++done) + "/" + list.length + "\u2026";
    try {
      const r = await api("brand", {
        brand: it.brand, domain: it.domain, skipMisses: true, applyToItems: true
      });
      if (r.icon) found++;
      if (r.state) adopt(r.state);
    } catch (e){
      writeFailed(e);
      break;
    }
  }
  btn.disabled = false; btn.textContent = label;
  render();
  toast(found + " of " + list.length + " brands have a logo");
}

});
$("fDomain").addEventListener("change", () => showBrandIcon($("fDomain").value.trim()));

$("fPhoto").onchange = async e => {
  const f = e.target.files && e.target.files[0];
  if (!f) return;
  try { showPhoto(await compress(f), "new"); }
  catch { toast("Couldn't read that image"); showPhoto(null, "none"); }
};
$("dropClear").onclick = () => showPhoto(null, "none");
["dragover","dragenter"].forEach(ev =>
  $("drop").addEventListener(ev, e => e.preventDefault()));
$("drop").addEventListener("drop", async e => {
  e.preventDefault();
  const f = e.dataTransfer.files && e.dataTransfer.files[0];
  if (!f) return;
  try { showPhoto(await compress(f), "new"); } catch { toast("Couldn't read that image"); }
});

$("q").oninput = e => { query = e.target.value; render(); };
$("sort").onchange = e => { sortBy = e.target.value; render(); };
$("vGrid").onclick = () => setView("grid");
$("vList").onclick = () => setView("list");
function setView(v){
  view = v;
  $("vGrid").setAttribute("aria-pressed", v === "grid");
  $("vList").setAttribute("aria-pressed", v === "list");
  render();
}
async function setUnits(m){
  if (metric === m) return;
  metric = m; render();
  try { await api("meta", { metric }); } catch (e){ console.error(e); }
}
$("uMetric").onclick = () => setUnits(true);
$("uImperial").onclick = () => setUnits(false);

$("chips").addEventListener("click", e => {
  const b = e.target.closest(".chip"); if (!b) return;
  filterCat = b.dataset.cat; render();
});
$("stage").addEventListener("click", e => {
  const act = e.target.closest("[data-act]");
  if (act){
    if (act.dataset.act === "add") openDrawer(null);
    if (act.dataset.act === "sample") loadSamples();
    if (act.dataset.act === "clear"){ query = ""; $("q").value = ""; filterCat = "ALL"; render(); }
    return;
  }
  const card = e.target.closest("[data-id]");
  if (card) select(card.dataset.id);
});
$("entry").addEventListener("click", e => {
  const act = e.target.closest("[data-act]"); if (!act) return;
  if (act.dataset.act === "edit") openDrawer(items.find(i => i.id === selectedId));
  if (act.dataset.act === "close"){ selectedId = null; render(); }
});

$("expJson").onclick = () => { window.location.href = "/api/export"; };
$("expCsv").onclick  = exportCsv;
$("impBtn").onclick  = () => $("impFile").click();
$("impFile").onchange = e => {
  const f = e.target.files && e.target.files[0];
  if (f) importJson(f);
  e.target.value = "";
};

/* ============================================================
   12. Boot
   ============================================================ */
(async function boot(){
  try {
    const res = await fetch("/api/state");
    if (!res.ok) throw new Error("server said " + res.status);
    const state = await res.json();
    adopt(state);
    online = true;
    $("storeNote").textContent = "Saving to " + (state.dataFile || "data/gear.json");
  } catch (e){
    offline(location.protocol === "file:" ? "opened as a file, not through the server" : "");
  }
  render();
})();
</script>
</body>
</html>
